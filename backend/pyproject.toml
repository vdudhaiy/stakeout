[project]
name = "stakeout-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "aiosqlite",
    "pandas",
    "stakeout-utils",
    "yfinance>=1.4.1",
    "lxml",
    "pandas_market_calendars",
    "xlsxwriter",
    "asyncpg",
    "alembic",
    "httpx",
    "pyjwt",
    "bcrypt",
    "email-validator",
]

# Flat layout: backend/src has no wrapping package (main.py, config.py, etc. import
# each other with relative imports and nothing outside backend imports this code),
# so top-level modules and subpackages are both discovered directly under src.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["auth", "cache", "config", "database", "main", "markets"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
stakeout-utils = { workspace = true }
