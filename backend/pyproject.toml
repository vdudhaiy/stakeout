[project]
name = "stakeout-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "aiosqlite",
    "pandas",
    "stakeout-utils",
    "yfinance>=1.4.1",
    "lxml",
    "pandas_market_calendars",
    "xlsxwriter",
    "openpyxl",
    "python-multipart",
    "asyncpg",
    "alembic",
    "httpx",
    "pyjwt[crypto]",
    "bcrypt",
    "email-validator",
]

# Flat layout: backend/src has no wrapping package (main.py, config.py, etc. import
# each other with relative imports and nothing outside backend imports this code),
# so top-level modules and subpackages are both discovered directly under src.
#
# `packages.find` below picks up the subpackages (routers, services, models,
# schemas) automatically, but the flat modules do NOT get discovered — every
# one has to be listed here by hand or it is simply absent from the installed
# wheel. A deployment then imports the *installed* routers, which fail on a
# module that only ever existed in the working tree. test_packaging.py checks
# this list against the directory so the next flat module can't slip through.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["auth", "cache", "config", "database", "freshness", "main", "markets", "rate_limit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
stakeout-utils = { workspace = true }
