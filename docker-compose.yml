# Stakeout — self-hosted / local Docker deployment.
#
#   docker compose up --build        # then open http://localhost:3000
#
# What you get:
#   db        Postgres 16 with a persistent volume (stakeout-pgdata)
#   backend   FastAPI API; runs `alembic upgrade head` on start
#   frontend  nginx serving the built SPA and proxying API calls to backend
#
# Auth & data — two modes, chosen by what's in your root .env:
#   - Nothing set: backend runs its own local email/password accounts,
#     stored in the `db` container above. No cloud project needed.
#   - DATABASE_URL / SUPABASE_JWKS_URL set (plus the frontend's
#     VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY, baked in at frontend build
#     time): backend verifies real Supabase sign-ins and talks to that
#     DATABASE_URL instead. The `db` container still starts (harmless) but
#     sits empty — nothing ever writes to its volume in this mode.
#
# This file is for local/self-hosted use only. Cloud deployment (Vercel +
# Render + Supabase) is documented separately in the README and does not
# use these containers.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stakeout
      POSTGRES_PASSWORD: stakeout
      POSTGRES_DB: stakeout
    volumes:
      - stakeout-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stakeout -d stakeout"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment to reach Postgres from your host (psql, GUI clients):
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      # Falls back to the local `db` container unless DATABASE_URL is set in
      # the root .env (e.g. to a Supabase Postgres connection string).
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://stakeout:stakeout@db:5432/stakeout}
      LOG_LEVEL: INFO
      # Unset by default → local email/password auth. Set both (plus the
      # frontend's VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY at build time)
      # to verify real Supabase sign-ins instead.
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Uncomment to hit the API directly (Swagger at http://localhost:8000/docs):
    # ports:
    #   - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  stakeout-pgdata:
