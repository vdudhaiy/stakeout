# Serves the built SPA and proxies API paths to the backend container.
# The proxied prefixes mirror frontend/vite.config.ts exactly — if you add a
# new backend router prefix, add it in BOTH places.

upstream stakeout_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API prefixes → FastAPI. `/portfolio` is both an API prefix and an SPA
    # route; browser navigations send Accept: text/html and fall through to
    # the SPA, mirroring bypassHtmlNavigations() in vite.config.ts.
    location ~ ^/(stocks|health|portfolio|indicators|watchlist|news|fx|ai|auth|account|version)(/|$) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://stakeout_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # first fetch of a new ticker can be slow
    }

    # Hashed build assets can be cached hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes (/tracker, /portfolio, /settings, …)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
