[project]
name = "stakeout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "stakeout-utils",
    # "stakeout-models",  # TODO: uncomment once models/ is committed
    "stakeout-dashboard",
]

[tool.uv.sources]
stakeout-utils = { workspace = true }
# stakeout-models = { workspace = true }  # TODO: uncomment once models/ is committed
stakeout-dashboard = { workspace = true }

[tool.uv.workspace]
members = [
    "utils",
    # "models",  # TODO: uncomment once models/ is committed
    "backend",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"

# Scoped to blind-except (BLE) only: the codebase already has `# noqa: BLE001`
# comments assuming this rule is enabled. Widening beyond BLE is a separate,
# deliberate follow-up, not bundled into this fix.
[tool.ruff.lint]
select = ["BLE"]
